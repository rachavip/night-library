# 路径、IP、端口都是示例，按自己的 NAS 换成实际值；逐项说明见 README「compose 文件说明」。
services:
  night-library:
    image: ghcr.nju.edu.cn/rachavip/night-library:latest
    container_name: night-library
    restart: unless-stopped
    ports:
      # 宿主机 8421 → 容器 8080
      - "8421:8080"
    volumes:
      # 整个 vol1 只读挂入，路径保持一致
      - /vol1:/vol1:ro
      # 索引 / 封面 / 缓存 / 进度
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 默认书籍目录。这里是镜像自带的 demo-books（3 本示例 txt），
      # 好处是本地没有 /vol1/1000/EBook 之类的目录时，首次启动也不会报路径不存在，
      # 打开就能看到书架。实际使用请改成自己的书库目录，例如：
      #   BOOKS_DIR: /vol1/1000/电子书文件夹名
      BOOKS_DIR: /app/demo-books
      DATA_DIR: /app/data
      PORT: "8080"
      # 可选：自动刮削（不写就用网页里的设置）
      # SCAN_ON_START: 1
      # SCAN_INTERVAL_MINUTES: 60
      # 可选：音乐服务地址（不写就用网页里保存的地址）
      # MUSIC_URL: http://192.168.0.111:9500
      # MUSIC_MODE: embed
