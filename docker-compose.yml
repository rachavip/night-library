# 路径、IP、端口都是示例，按自己的 NAS 换成实际值；逐项说明见 README「compose 文件说明」。
services:
  night-library:
    image: ghcr.nju.edu.cn/rachavip/night-library:latest
    container_name: night-library
    restart: unless-stopped
    ports:
      # 宿主机 8421 → 容器 8080
      - "8421:8080"
    volumes:
      # 整个 vol1 只读挂入，路径保持一致
      - /vol1:/vol1:ro
      # 索引 / 封面 / 缓存 / 进度
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 默认书籍目录（示例，改成自己的）
      BOOKS_DIR: /vol1/1000/EBook
      DATA_DIR: /app/data
      PORT: "8080"
      # 可选：自动刮削（不写就用网页里的设置）
      # SCAN_ON_START: 1
      # SCAN_INTERVAL_MINUTES: 60
      # 可选：音乐服务地址（不写就用网页里保存的地址）
      # MUSIC_URL: http://192.168.0.111:9500
      # MUSIC_MODE: embed
