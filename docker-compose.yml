name: ebooks

services:
  ebooks:
    # ===== 部署前只需改这一行 =====
    # 把 your-github-name 换成你的 GitHub 用户名（必须小写），
    # 仓库名保持 night-library，与 DEPLOY_GITHUB.md 里的步骤一致。
    image: ghcr.io/rachavip/night-library:latest
    # 如果想在自己的机器上本地构建（不经过 GitHub），
    # 改用同目录下的 docker-compose.build.yml 即可。
    container_name: ebooks
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 把飞牛 NAS 的 vol1 整个挂进去，且路径保持一致。
      # 这样在网页设置里填 /vol1/1000/任意文件夹 都能被刮削到（只读，不动原书）。
      - /vol1:/vol1:ro
      # 索引 / 封面 / 转换缓存 / 阅读进度，跟随本 compose 文件所在目录
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 默认电子书文件夹；可在网页「设置 - 电子书文件夹」里增删
      BOOKS_DIR: /vol1/1000/EBook
      DATA_DIR: /app/data
      PORT: "8080"
