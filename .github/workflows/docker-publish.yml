name: 构建并发布镜像到 GHCR

# 把代码 push 到 main 分支（或打 v* 标签）后自动构建镜像并推送到
# GitHub Container Registry。镜像地址：ghcr.io/<你的用户名>/<仓库名>:latest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository 形如 "owner/repo"，GHCR 要求小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 允许用 GITHUB_TOKEN 推送镜像到 GHCR

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Docker Buildx
        # 已按 x86_64（amd64）配置，匹配飞牛 NAS 的 x86 架构，无需改动。
        # 只有以后换成 ARM 版 NAS 时，才把 platforms 改成 linux/arm64
        # 或写 linux/amd64,linux/arm64 构建多架构镜像（耗时更久）。
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
