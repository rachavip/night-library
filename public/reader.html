<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F0E4">
  <title>阅读 · 夜读</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reader.css">
</head>
<body data-theme="paper">
  <header class="reader-bar">
    <button class="back" type="button" id="reader-back" aria-label="关闭阅读器返回书房">← <span id="back-label">书房</span></button>
    <div class="book-meta">
      <h1 id="book-title">正在打开…</h1>
      <span id="book-author"></span>
    </div>
    <div class="controls">
      <div class="zoom-group" id="zoom-group" hidden>
        <select id="zoom-mode" aria-label="缩放方式">
          <option value="fit-width">匹配宽度</option>
          <option value="fit-page">匹配页面</option>
          <option value="fit-visible">匹配可见</option>
          <option value="actual">实际大小</option>
        </select>
      </div>
      <button type="button" id="notes-btn" title="笔记与书签" aria-label="笔记与书签">笔记</button>
      <button type="button" id="theme-btn" title="切换阅读主题">夜读</button>
      <div class="font-group" role="group" aria-label="字号">
        <button type="button" id="font-down" aria-label="减小字号">−</button>
        <span id="font-size">18</span>
        <button type="button" id="font-up" aria-label="增大字号">+</button>
      </div>
      <span id="page-info"></span>
    </div>
  </header>

  <main class="viewer" id="viewer" aria-label="阅读内容"></main>

  <div class="reader-busy" id="reader-busy" hidden role="status" aria-live="polite">
    <span id="reader-busy-text">正在打开…</span>
  </div>

  <footer class="reader-foot">
    <button type="button" id="first" title="回到第一页（Home）">首页</button>
    <button type="button" id="prev">上一页</button>
    <label class="page-jump" id="page-jump" hidden>
      <input id="page-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
             aria-label="输入页码后回车跳转" title="输入页码，回车跳转">
      <span id="page-total">/ 1</span>
    </label>
    <input type="range" id="progress-track" min="0" max="100" value="0" aria-label="阅读进度">
    <button type="button" id="next">下一页</button>
    <button type="button" id="last" title="跳到最后一页（End）">末页</button>
  </footer>

  <div class="reader-error" id="reader-error" hidden>
    <h2>这本书暂时打不开</h2>
    <p id="reader-error-text"></p>
    <a href="/">回到书房</a>
  </div>

  <!-- highlights, notes and bookmarks -->
  <aside class="notes-panel" id="notes-panel" hidden aria-label="笔记与书签">
    <div class="notes-head">
      <h2>笔记与书签</h2>
      <button type="button" id="notes-close" aria-label="关闭笔记">×</button>
    </div>
    <div class="notes-tabs" role="group" aria-label="笔记类型">
      <button type="button" data-tab="highlights" aria-pressed="true">高亮<em id="notes-hl-count">0</em></button>
      <button type="button" data-tab="bookmarks" aria-pressed="false">书签<em id="notes-bm-count">0</em></button>
    </div>
    <div class="notes-body" id="notes-body"></div>
    <div class="notes-foot">
      <button type="button" id="add-bookmark">＋ 加书签</button>
      <button type="button" id="notes-export">导出 Markdown</button>
    </div>
  </aside>

  <!-- appears next to a selection inside the book -->
  <div class="sel-bar" id="sel-bar" hidden>
    <button type="button" data-act="highlight">高亮</button>
    <button type="button" data-act="note">写笔记</button>
    <button type="button" data-act="cancel" aria-label="取消">×</button>
  </div>

  <div class="note-mask" id="note-mask" hidden></div>
  <form class="note-editor" id="note-editor" hidden>
    <p class="note-quote" id="note-quote"></p>
    <textarea id="note-text" rows="4" placeholder="写点什么…" aria-label="笔记内容"></textarea>
    <div class="note-actions">
      <button type="button" id="note-cancel">取消</button>
      <button type="submit">保存</button>
    </div>
  </form>

  <script src="/vendor/pdf.min.js"></script>
  <!-- epub.js reads EPUBs through JSZip and expects it as a global; without
       this line every EPUB (and every converted MOBI) dies with
       "JSZip lib not loaded". -->
  <script src="/vendor/jszip.min.js"></script>
  <script src="/vendor/epub.min.js"></script>
  <script src="/js/reader.js"></script>
</body>
</html>
