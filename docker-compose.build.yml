# 本地构建版（不经过 GitHub）。用法：
#   docker compose -f docker-compose.build.yml up -d --build
# name 是变体专用项目名，避免和主 compose 混成一个项目，详见 README。
name: night-library-build

services:
  night-library:
    build: .
    image: night-library:local
    container_name: night-library
    restart: unless-stopped
    ports:
      - "8421:8080"
    volumes:
      - /vol1:/vol1:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      BOOKS_DIR: /vol1/1000/EBook
      DATA_DIR: /app/data
      PORT: "8080"
