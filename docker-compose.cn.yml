name: ebooks

# 国内源本地构建版：apt 走阿里云、npm 走 npmmirror，绕开 GHCR 拉取慢的问题。
# 用法（在项目目录 /vol1/1000/docker/ebooks 下执行）：
#   docker compose -f docker-compose.cn.yml up -d --build
# 源码需放在此目录：Dockerfile.cn、package.json、package-lock.json、server/、public/、scripts/
services:
  ebooks:
    build:
      context: .
      dockerfile: Dockerfile.cn
    image: night-library:cn
    container_name: ebooks
    restart: unless-stopped
    ports:
      # 与镜像版一致，访问地址 http://NAS地址:8421
      - "8421:8080"
    volumes:
      - /vol1:/vol1:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      BOOKS_DIR: /vol1/1000/EBook
      DATA_DIR: /app/data
      PORT: "8080"
      # 自动刮削：默认每次启动刮一次 + 每 60 分钟刮一次
      # SCAN_ON_START: 1
      # SCAN_INTERVAL_MINUTES: 60   # 设 0 = 只保留启动刮一次
