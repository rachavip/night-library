# 国内源本地构建版（apt 走阿里云、npm 走 npmmirror）。用法：
#   docker compose -f docker-compose.cn.yml up -d --build
# name 是变体专用项目名，避免和主 compose 混成一个项目，详见 README。
name: night-library-cn

services:
  night-library:
    build:
      context: .
      dockerfile: Dockerfile.cn
    image: night-library:cn
    container_name: night-library
    restart: unless-stopped
    ports:
      - "8421:8080"
    volumes:
      - /vol1:/vol1:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 默认用镜像自带的 demo-books 示例书；实际改成自己的书库目录，如 /vol1/1000/电子书文件夹名
      BOOKS_DIR: /app/demo-books
      DATA_DIR: /app/data
      PORT: "8080"
